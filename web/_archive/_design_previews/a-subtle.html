<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>A - Subtle Depth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --zinc-50: #fafafa; --zinc-100: #f4f4f5; --zinc-200: #e4e4e7; --zinc-300: #d4d4d8;
    --zinc-400: #a1a1aa; --zinc-500: #71717a; --zinc-700: #3f3f46; --zinc-900: #1c1b1f;
    --rose-50: #fdf3f5; --rose-100: #fbe3e9; --rose-300: #d99cae; --rose-500: #a8415f; --rose-600: #8f3350;
    --bg: var(--zinc-50); --surface: #ffffff; --text: var(--zinc-900); --text-soft: var(--zinc-500);
    --border: var(--zinc-200); --accent: var(--rose-500); --accent-soft: var(--rose-50);
    --radius-lg: 20px; --radius-md: 12px; --radius-sm: 8px;
    --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); }
  .label { text-align: center; padding: 14px; font-size: 13px; color: var(--text-soft); background: #fff; border-bottom: 1px solid var(--border); }

  .hero {
    position: relative;
    padding: 80px 24px 64px;
    text-align: center;
    background:
      radial-gradient(circle at 50% -10%, var(--rose-100) 0%, transparent 55%),
      var(--bg);
    overflow: hidden;
  }
  .hero h1 {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  .hero p { color: var(--text-soft); font-size: 16px; margin: 0 0 28px; }
  .btn {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(168,65,95,0.15), 0 12px 24px -10px rgba(168,65,95,0.45);
    transition: transform 0.25s var(--ease-spring), box-shadow 0.25s var(--ease-spring);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(168,65,95,0.2), 0 18px 32px -12px rgba(168,65,95,0.55); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 48px 40px; max-width: 1000px; margin: 0 auto; }
  .card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(28,27,31,0.04), 0 8px 24px -12px rgba(28,27,31,0.08);
    transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-spring);
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 1px 2px rgba(28,27,31,0.05), 0 20px 40px -16px rgba(168,65,95,0.25);
  }
  .card .img {
    height: 180px;
    background: linear-gradient(155deg, var(--rose-50), var(--zinc-100));
  }
  .card .body { padding: 16px; }
  .card .cat { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-soft); }
  .card h3 { margin: 4px 0 6px; font-size: 16px; }
  .card .price { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="label">ARAH A — Depth halus, palet sekarang (rose/zinc), shadow elevation, tanpa gradient warna mencolok</div>
  <div class="hero">
    <h1>Koleksi Terbaru brand</h1>
    <p>Kaos, hoodie, jaket, dan celana favoritmu</p>
    <a class="btn" href="#">Belanja Sekarang</a>
  </div>
  <div class="grid">
    <div class="card"><div class="img"></div><div class="body"><div class="cat">Celana</div><h3>Celana Cargo</h3><div class="price">Rp199.000</div></div></div>
    <div class="card"><div class="img"></div><div class="body"><div class="cat">Jaket</div><h3>Jaket Denim</h3><div class="price">Rp289.000</div></div></div>
    <div class="card"><div class="img"></div><div class="body"><div class="cat">Kaos</div><h3>Kaos Basic</h3><div class="price">Rp99.000</div></div></div>
  </div>
</body>
</html>
