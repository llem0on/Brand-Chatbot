<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>B - Bold Gradient + 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --zinc-50: #fafafa; --zinc-900: #1c1b1f; --text-soft: #71717a;
    --radius-lg: 24px; --radius-md: 14px;
    --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--zinc-50); color: var(--zinc-900); }
  .label { text-align: center; padding: 14px; font-size: 13px; color: var(--text-soft); background: #fff; border-bottom: 1px solid #eee; }

  .hero {
    position: relative;
    padding: 90px 24px 100px;
    text-align: center;
    background: linear-gradient(125deg, #ff6f91 0%, #a8415f 38%, #6a3093 75%, #3d2a73 100%);
    color: #fff;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.25), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255,255,255,0.15), transparent 35%);
  }
  .hero h1 { position: relative; font-size: 46px; font-weight: 800; margin: 0 0 14px; text-shadow: 0 4px 24px rgba(0,0,0,0.2); }
  .hero p { position: relative; opacity: 0.92; font-size: 17px; margin: 0 0 30px; }
  .btn {
    position: relative;
    display: inline-block;
    padding: 16px 32px;
    border-radius: 999px;
    background: linear-gradient(135deg, #fff, #ffe3ec);
    color: #a8415f;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 2px 0 rgba(255,255,255,0.6) inset, 0 18px 36px -10px rgba(0,0,0,0.4);
    transition: transform 0.25s var(--ease-spring);
  }
  .btn:hover { transform: translateY(-3px) scale(1.02); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 56px 40px; max-width: 1040px; margin: -50px auto 0; position: relative; }
  .card {
    background: #fff;
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: 0 20px 50px -16px rgba(106,48,147,0.35), 0 4px 12px rgba(0,0,0,0.06);
    transform-style: preserve-3d;
    perspective: 800px;
    transition: transform 0.4s var(--ease-spring), box-shadow 0.4s var(--ease-spring);
  }
  .card:hover {
    transform: rotateX(4deg) rotateY(-6deg) translateY(-6px) scale(1.02);
    box-shadow: 0 30px 60px -16px rgba(106,48,147,0.45), 0 8px 16px rgba(0,0,0,0.08);
  }
  .card .img {
    height: 190px;
    background: linear-gradient(135deg, #ff9a8b, #a8415f 50%, #6a3093);
  }
  .card .body { padding: 18px; }
  .card .cat { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #a1a1aa; font-weight: 600; }
  .card h3 { margin: 4px 0 6px; font-size: 17px; }
  .card .price {
    font-weight: 700;
    background: linear-gradient(135deg, #a8415f, #6a3093);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
</style>
</head>
<body>
  <div class="label">ARAH B — Gradient warna berani, hero vibrant, 3D tilt card on hover, glow/depth kuat</div>
  <div class="hero">
    <h1>Koleksi Terbaru brand</h1>
    <p>Kaos, hoodie, jaket, dan celana favoritmu</p>
    <a class="btn" href="#">Belanja Sekarang</a>
  </div>
  <div class="grid">
    <div class="card"><div class="img"></div><div class="body"><div class="cat">Celana</div><h3>Celana Cargo</h3><div class="price">Rp199.000</div></div></div>
    <div class="card"><div class="img"></div><div class="body"><div class="cat">Jaket</div><h3>Jaket Denim</h3><div class="price">Rp289.000</div></div></div>
    <div class="card"><div class="img"></div><div class="body"><div class="cat">Kaos</div><h3>Kaos Basic</h3><div class="price">Rp99.000</div></div></div>
  </div>
</body>
</html>
