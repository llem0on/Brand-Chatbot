<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>C - Balanced</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --zinc-50: #fafafa; --zinc-100: #f4f4f5; --zinc-200: #e4e4e7;
    --zinc-500: #71717a; --zinc-900: #1c1b1f;
    --rose-50: #fdf3f5; --rose-100: #fbe3e9; --rose-300: #d99cae; --rose-500: #a8415f; --rose-600: #8f3350;
    --amber-200: #f3cfa0;
    --radius-lg: 22px; --radius-sm: 10px;
    --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--zinc-50); color: var(--zinc-900); }
  .label { text-align: center; padding: 14px; font-size: 13px; color: var(--zinc-500); background: #fff; border-bottom: 1px solid var(--zinc-200); }

  .hero {
    position: relative;
    padding: 84px 24px 72px;
    text-align: center;
    background: linear-gradient(160deg, var(--rose-50) 0%, #fdf8ee 55%, var(--zinc-50) 100%);
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute;
    width: 380px; height: 380px;
    background: radial-gradient(circle, var(--rose-100), transparent 70%);
    top: -120px; right: -80px;
    border-radius: 50%;
  }
  .hero h1 { position: relative; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
  .hero p { position: relative; color: var(--zinc-500); font-size: 16px; margin: 0 0 28px; }
  .btn {
    position: relative;
    display: inline-block;
    padding: 15px 30px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--rose-500), var(--rose-600));
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    box-shadow: 0 1px 2px rgba(168,65,95,0.2), 0 16px 28px -10px rgba(168,65,95,0.5);
    transition: transform 0.25s var(--ease-spring), box-shadow 0.25s var(--ease-spring);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(168,65,95,0.25), 0 22px 36px -12px rgba(168,65,95,0.6); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; padding: 52px 40px; max-width: 1020px; margin: 0 auto; perspective: 1200px; }
  .card {
    background: #fff;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--zinc-200);
    box-shadow: 0 1px 2px rgba(28,27,31,0.04), 0 10px 28px -14px rgba(28,27,31,0.1);
    transition: transform 0.35s var(--ease-spring), box-shadow 0.35s var(--ease-spring);
  }
  .card:hover {
    transform: rotateX(2deg) rotateY(-3deg) translateY(-5px);
    box-shadow: 0 1px 2px rgba(28,27,31,0.05), 0 24px 44px -16px rgba(168,65,95,0.3);
  }
  .card .img {
    height: 185px;
    background: linear-gradient(150deg, var(--rose-100), var(--amber-200) 120%);
  }
  .card .body { padding: 17px; }
  .card .cat { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--zinc-500); }
  .card h3 { margin: 5px 0 6px; font-size: 16px; }
  .card .price { color: var(--rose-600); font-weight: 600; }
</style>
</head>
<body>
  <div class="label">ARAH C — Tengah-tengah: tetap minim & rapi, 1 gradient mesh halus di hero + foto produk, card tilt 3D ringan saat hover</div>
  <div class="hero">
    <h1>Koleksi Terbaru brand</h1>
    <p>Kaos, hoodie, jaket, dan celana favoritmu</p>
    <a class="btn" href="#">Belanja Sekarang</a>
  </div>
  <div class="grid">
    <div class="card"><div class="img"></div><div class="body"><div class="cat">Celana</div><h3>Celana Cargo</h3><div class="price">Rp199.000</div></div></div>
    <div class="card"><div class="img"></div><div class="body"><div class="cat">Jaket</div><h3>Jaket Denim</h3><div class="price">Rp289.000</div></div></div>
    <div class="card"><div class="img"></div><div class="body"><div class="cat">Kaos</div><h3>Kaos Basic</h3><div class="price">Rp99.000</div></div></div>
  </div>
</body>
</html>
