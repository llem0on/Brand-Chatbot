<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>brand — Toko Baju</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .filters select {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 13px;
      background: var(--surface);
      color: var(--text);
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s var(--ease-spring), box-shadow 0.2s var(--ease-spring);
    }
    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }
    .product-card .image {
      aspect-ratio: 4/3;
      background: var(--zinc-100);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--zinc-400);
      font-size: 12px;
      overflow: hidden;
    }
    .product-card .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product-card .body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .product-card .category {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-soft);
    }
    .product-card .name {
      font-weight: 600;
      font-size: 14px;
    }
    .product-card .price {
      font-weight: 600;
      color: var(--accent-strong);
      margin-top: auto;
    }
    .product-card .variant-select {
      width: 100%;
      padding: 7px 8px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--zinc-50);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="site-nav-root"></div>

  <main class="page">
    <h1>Koleksi Produk</h1>
    <p class="lede">Temukan kaos, hoodie, jaket, dan celana favoritmu.</p>

    <div class="filters">
      <select id="filterCategory"><option value="">Semua Kategori</option></select>
      <select id="filterMaterial"><option value="">Semua Bahan</option></select>
      <select id="filterGender"><option value="">Semua Gender</option></select>
      <select id="filterSize"><option value="">Semua Ukuran</option></select>
    </div>

    <div id="productGrid" class="product-grid">
      <p class="muted">Memuat produk...</p>
    </div>
  </main>

  <script src="/session.js"></script>
  <script src="/nav.js"></script>
  <script src="/home.js"></script>
  <script src="/chat-widget.js"></script>
</body>
</html>
