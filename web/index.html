<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>brand — Chatbot Toko Baju</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">B</div>
        <div class="brand-text">
          <h1>brand</h1>
          <p>tagline</p>
        </div>
      </div>

      <div class="status-card">
        <div class="status-row">
          <span class="dot"></span>
          <span>Online</span>
        </div>
        <p class="status-hint">Tanya tentang ukuran, stok, harga, atau promo.</p>
      </div>

      <div class="quick-prompts">
        <h3>Coba tanyakan</h3>
        <button class="chip" data-prompt="halo, aku cari kaos ukuran L">Cari kaos size L</button>
        <button class="chip" data-prompt="ada promo apa aja hari ini?">Promo hari ini</button>
        <button class="chip" data-prompt="bahan cotton combed 30s ready warna apa aja?">Stok cotton combed</button>
        <button class="chip" data-prompt="ongkir ke Jakarta berapa?">Ongkir ke Jakarta</button>
      </div>

      <div class="sidebar-footer">
        <button id="resetBtn" class="ghost">Reset percakapan</button>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div class="avatar">B</div>
        <div class="header-info">
          <h2>brand</h2>
          <span class="status"><span class="dot"></span> Online</span>
        </div>
      </header>

      <div id="messages" class="messages">
        <!-- messages injected here -->
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <textarea
          id="input"
          placeholder="Tulis pesan ke brand..."
          rows="1"
        ></textarea>
        <button type="submit" id="sendBtn" aria-label="Kirim">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
