<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang — brand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: start;
    }
    .cart-item {
      display: flex;
      gap: 14px;
      padding: 16px;
      margin-bottom: 10px;
      align-items: center;
    }
    .cart-item .info {
      flex: 1;
    }
    .cart-item .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-summary {
      padding: 20px;
      position: sticky;
      top: 90px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .summary-row.total {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 18px;
    }
    @media (max-width: 860px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="site-nav-root"></div>

  <main class="page">
    <h1>Keranjang</h1>
    <p class="lede">Produk yang belum kamu checkout.</p>

    <div id="cartError" class="error-banner hidden"></div>
    <div id="cartSuccess" class="success-banner hidden"></div>

    <div id="cartEmpty" class="hidden muted">
      Keranjang kamu masih kosong. <a href="/" style="color:var(--accent-strong); font-weight:500;">Mulai belanja</a>
    </div>

    <div id="cartLayout" class="cart-layout hidden">
      <div id="cartList"></div>

      <div class="card cart-summary">
        <div class="summary-row">
          <span class="muted">Subtotal</span>
          <span id="cartSubtotal">Rp0</span>
        </div>
        <div class="summary-row">
          <span class="muted">Ongkos Kirim</span>
          <span id="cartShipping">-</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="cartTotal">Rp0</span>
        </div>

        <div id="checkoutGuestNotice" class="hidden">
          <p class="muted" style="margin-bottom:12px;">Login dulu untuk checkout.</p>
          <a href="/login.html" class="btn btn-full">Login</a>
        </div>

        <div id="checkoutVerifyNotice" class="hidden">
          <p class="muted" style="margin-bottom:12px;">Verifikasi email kamu dulu sebelum checkout.</p>
          <button id="resendVerificationBtn" class="btn btn-secondary btn-full">Kirim Ulang Email Verifikasi</button>
        </div>

        <form id="checkoutForm" class="hidden">
          <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="checkoutName" required />
          </div>
          <div class="form-group">
            <label>No HP</label>
            <input type="text" id="checkoutPhone" required />
          </div>
          <div class="form-group">
            <label>Alamat Lengkap</label>
            <textarea id="checkoutAddress" required></textarea>
          </div>
          <div class="form-group">
            <label>Metode Pembayaran</label>
            <select id="checkoutPaymentMethod">
              <option value="transfer_bank">Transfer Bank</option>
              <option value="qris">QRIS</option>
            </select>
          </div>
          <button type="submit" class="btn btn-full">Checkout</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/session.js"></script>
  <script src="/nav.js"></script>
  <script src="/order.js"></script>
  <script src="/chat-widget.js"></script>
</body>
</html>
