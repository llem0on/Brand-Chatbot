<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — brand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="site-nav-root"></div>

  <main class="page page-narrow">
    <h1>Daftar Akun</h1>
    <div class="card" style="padding:28px;">
      <div id="registerError" class="error-banner hidden"></div>
      <form id="registerForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="registerEmail" required />
        </div>
        <div class="form-group">
          <label>Password (min. 8 karakter)</label>
          <input type="password" id="registerPassword" minlength="8" required />
        </div>
        <button type="submit" class="btn btn-full">Daftar</button>
      </form>
      <p class="muted" style="margin-top:16px; font-size:13px;">
        Sudah punya akun? <a href="/login.html" style="color:var(--accent-strong); font-weight:500;">Login di sini</a>
      </p>
    </div>
  </main>

  <script src="/session.js"></script>
  <script src="/nav.js"></script>
  <script src="/register.js"></script>
  <script src="/chat-widget.js"></script>
</body>
</html>
